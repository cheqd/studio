name: 'Staging'
on:
    workflow_call:
defaults:
    run:
        shell: bash

jobs:
    migrations:
        name: 'Database migrations'
        uses: ./.github/workflows/migrations.yml
        secrets: inherit

    deploy-staging:
        name: 'Staging Deploy'
        needs: migrations
        runs-on: ubuntu-latest
        env:
            IMAGE_NAME: ${{ github.repository }}
        environment:
            name: staging
            url: https://studio-api-staging.cheqd.net

        steps:
            - name: Install DigitalOcean CLI
              uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2 (v2.5.2)
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Login to DOCR
              run: doctl registry login --expiry-seconds 600

            - name: Login to GitHub Container Registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download docker image
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: studio-staging

            - name: Load Docker image
              run: docker image load --input studio-staging.tar

            - name: Push image to GitHub Container Registry
              run: docker image push --all-tags ghcr.io/${{ env.IMAGE_NAME }}

            - name: Push images to DOCR
              run: docker image push --all-tags registry.digitalocean.com/${{ env.IMAGE_NAME }}
